  build-and-test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --watch=false --browsers=ChromeHeadless
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
    
    - name: Build Docker image for frontend
      run: docker build -t payment-frontend:${{ github.sha }} ./frontend
    

  deploy:
    needs: [build-and-test-payment-service, build-and-test-fraud-service, build-and-test-ledger-service, build-and-test-notification-service, build-and-test-settlement-service, build-and-test-reporting-service, build-and-test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production server"
        # Add your deployment commands here
        # Example: SSH to server and run docker-compose pull && docker-compose up -d
        # docker-compose -f compose.yaml pull
        # docker-compose -f compose.yaml up -d
