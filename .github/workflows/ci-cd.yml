name: Payment Gateway Microservices CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test-payment-service:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: payment-service/pom.xml
    
    - name: Build payment service
      working-directory: ./payment-service
      run: mvn clean package -DskipTests
    
    - name: Run tests
      working-directory: ./payment-service
      run: mvn test
    
    - name: Build Docker image
      run: docker build -t payment-service:${{ github.sha }} ./payment-service
    

  build-and-test-fraud-service:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
