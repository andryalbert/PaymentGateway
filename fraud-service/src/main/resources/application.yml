spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://localhost:5433/frauddb
    username: frauduser
    password: fraudpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
    consumer:
      group-id: fraud-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

fraud:
  detection:
    max-amount-per-day: 10000
    max-transactions-per-hour: 5
    max-amount-per-transaction: 5000
    suspicious-countries: XX,ZZ
    velocity-check-enabled: true
    device-fingerprinting-enabled: true

logging:
  level:
    com.andryalbert.fraud: DEBUG
    org.springframework.kafka: DEBUG
